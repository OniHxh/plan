<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Plan</title>
<style>
:root{--bg:#07080c;--s1:#12141c;--s2:#1c1f2b;--s3:#2a2e3d;--in:#0d0f16;--tx:#f5f7ff;--mu:#8a90a6;--ac:#10b981;--aci:#34d3a6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:22px;--g1:#10b981;--g2:#0ea5e9;--grad:linear-gradient(135deg,var(--g1),var(--g2));--line:rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;min-height:100vh;background:radial-gradient(1100px 560px at 85% -10%,rgba(14,165,233,.15),transparent 60%),radial-gradient(900px 500px at -10% 8%,rgba(16,185,129,.14),transparent 60%),var(--bg);background-attachment:fixed}
body.noscroll{overflow:hidden}
main{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 100px);max-width:560px;margin:0 auto}
h1{font-size:32px;margin:0 0 16px;letter-spacing:-.035em;line-height:1.1;font-weight:800}
h2{font-size:12px;margin:24px 4px 8px;color:#6f7590;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
h3{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 10px}
.muted{color:var(--mu)}.small{font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.card,.tile{background:linear-gradient(160deg,#171a25 0%,#10121a 100%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.card{border-radius:var(--r);padding:18px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-weight:600;color:var(--tx);user-select:none;-webkit-user-select:none}
.btn:active,.li:active,.tile:active{transform:scale(.98)}
.btn.pri,.banner,.chips button.on,.seg button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(16,185,129,.28)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}.btn.ghost{background:transparent;border-color:transparent}.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:none;color:var(--tx)}
.icon-btn.sm{width:32px;height:32px;font-size:14px;border-radius:9px}
.in{width:100%;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--tx);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-width:0}
.in:focus{border-color:var(--aci);box-shadow:0 0 0 3px rgba(52,211,166,.16)}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:13px;color:var(--mu);margin:0 0 5px 2px}
.seg{display:flex;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu);box-shadow:none}
.bar{height:9px;background:var(--in);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s}
.bar i.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.bar i.bad{background:linear-gradient(90deg,#ef4444,#f87171)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--in);border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:rgba(52,211,153,.3)}.badge.warn{color:var(--warn);border-color:rgba(251,191,36,.3)}.badge.bad{color:var(--bad);border-color:rgba(248,113,113,.3)}
.empty{color:var(--mu);text-align:center;padding:14px 8px;font-size:14px}
.big{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.tile{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.tile .lbl{font-size:12px;color:var(--mu);font-weight:600}
.tile .val{font-size:22px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:12px;color:var(--mu);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:15px}.kv span{color:var(--mu)}
.kv.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-weight:700}.kv.tot span{color:var(--tx)}
.banner{display:block;width:100%;text-align:left;font-weight:700;padding:14px 16px;border-radius:var(--r);margin-bottom:12px}
.banner small{display:block;font-weight:500;opacity:.9;margin-top:2px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .em{width:38px;height:38px;border-radius:12px;background:var(--in);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--mu)}
.li .r{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.notice{border:1px solid rgba(52,211,166,.35);background:linear-gradient(160deg,rgba(16,185,129,.13),rgba(14,165,233,.09) 60%,#10121a)}
/* feu */
.feu{position:relative;overflow:hidden}
.feu::before{content:'';position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;filter:blur(60px);opacity:.28;background:var(--lc)}
.feu.ok{--lc:var(--ok)}.feu.warn{--lc:var(--warn)}.feu.bad{--lc:var(--bad)}
.lights{display:flex;gap:8px;margin-bottom:14px;position:relative}
.lights i{width:16px;height:16px;border-radius:50%;background:#1d2130;border:1px solid var(--line)}
.lights i.on.ok{background:var(--ok);box-shadow:0 0 14px var(--ok)}.lights i.on.warn{background:var(--warn);box-shadow:0 0 14px var(--warn)}.lights i.on.bad{background:var(--bad);box-shadow:0 0 14px var(--bad)}
.feu h3{font-size:22px;letter-spacing:-.02em;margin-bottom:6px;position:relative}
.feu p{position:relative;color:#c9cee0}
.feu .foot{position:relative;font-size:12px;color:var(--mu);margin-top:6px}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:rgba(10,11,17,.74);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--line)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu);padding:6px 0;max-width:110px}
#nav button.on{color:#fff}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button.on svg{stroke:url(#ng);filter:drop-shadow(0 0 8px rgba(52,211,166,.55))}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font-size:10px;font-weight:600}
.chart .ln{fill:none;stroke:url(#lg);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .pj{fill:none;stroke:var(--mu);stroke-width:1.6;stroke-dasharray:4 4;opacity:.7}
.chart .gl{stroke:var(--line)}
.chart .dot{fill:#5eead4}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px;background:var(--grad)}.legend i.pj{background:var(--mu)}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.ov.in{background:rgba(0,0,0,.55)}
.panel{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#151824,#0e1017);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.ov.in .panel{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sheet-h h3{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chips button{background:var(--in);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);z-index:80;background:var(--tx);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:99px;font-size:14px;transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
/* editable rows */
.er{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;background:var(--in);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:8px}
.er .in{background:#151824;padding:10px}
.er>.wide{grid-column:1 / 3}.er>.wide2{grid-column:2 / 4}
.er .icon-btn{background:#151824;width:40px;height:42px}
.unit{position:relative}.unit .in{padding-right:28px}.unit b{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--mu);font-weight:600;pointer-events:none}
/* wizard */
.ob{max-width:480px;margin:0 auto}
.dots{display:flex;gap:5px;margin:4px 0 22px}.dots i{flex:1;height:4px;border-radius:9px;background:var(--s2)}.dots i.on{background:var(--grad)}
.logo{display:block;width:72px;height:72px;border-radius:20px;margin:12px 0 18px;box-shadow:0 14px 34px rgba(16,185,129,.30),0 0 0 1px var(--line);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.mini{width:34px;height:34px;border-radius:10px;box-shadow:0 0 0 1px var(--line);flex:none}
.wnav{display:flex;gap:8px;margin-top:18px}.wnav .btn{flex:1}
.hint{background:var(--in);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;color:#c9cee0;margin-bottom:12px}
.res{border-radius:16px;padding:14px;margin-top:12px;border:1px solid var(--line)}
.res.ok{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.3)}.res.warn{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.3)}.res.bad{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.3)}
.res h3{margin-bottom:6px}.res p{color:#c9cee0}
.goal{padding:14px 0;border-top:1px solid var(--line)}.goal:first-child{border-top:0;padding-top:2px}
.goal .gh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.goal .gs{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:7px;gap:8px}
.mv{display:flex;gap:4px}
/* 3D & graphiques */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
main.enter>*{animation:rise .5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i,0)*45ms)}
.d3{position:relative;margin:4px 0 6px}
.d3 svg{width:100%;height:auto;display:block;overflow:visible}
.d3 .sg{transition:transform .35s cubic-bezier(.2,.9,.25,1.3),opacity .25s;cursor:pointer}
.d3 .sg.sel{transform:translateY(-16px)}.d3.has-sel .sg:not(.sel){opacity:.3}
.d3 .spin{transform-origin:150px 90px;animation:pop .8s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-25deg)}}
.d3c{position:absolute;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:140px}
.d3c b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em}.d3c span{display:block;font-size:11px;color:var(--mu);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;width:100%;text-align:left;font-size:14px}
.lg.sel{background:var(--in)}.lg i{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:0 0 10px currentColor}
.lg .p{color:var(--mu);font-size:12px;width:40px;text-align:right}
.jars svg{width:100%;height:auto;display:block;overflow:visible}
.jars .liq{transform-box:fill-box;transform-origin:50% 100%;animation:fill 1.1s cubic-bezier(.2,.9,.25,1) both}
@keyframes fill{from{transform:scaleY(0)}}
.jars text{fill:var(--tx);font-weight:700;font-size:12px}.jars .lb{fill:var(--mu);font-size:10px;font-weight:600}
.gauge svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.gauge .needle{transform-origin:150px 140px;animation:needle 1.1s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes needle{from{transform:rotate(0deg)}}
.gauge text{fill:var(--mu);font-size:10px;font-weight:600}
.chart svg{touch-action:pan-y;cursor:crosshair}
.chart .cur{transition:opacity .15s}.chart .cur text{fill:#06231b;font-size:11px;font-weight:800}
.chart .ln{stroke-dasharray:1200;animation:draw 1.4s ease-out both}
@keyframes draw{from{stroke-dashoffset:1200}}
.spark{display:block;width:100%;height:26px;margin-top:2px}
body.discreet .unit .in{-webkit-text-security:disc}
.bdgrow{display:flex;flex-wrap:wrap;gap:6px;font-size:24px}.bdgrow span.off{filter:grayscale(1);opacity:.2}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgrid div{background:var(--in);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;font-weight:700;line-height:1.25}
.bgrid div b{display:block;font-size:30px;margin-bottom:4px}.bgrid div span{display:block;font-weight:500;color:var(--mu);font-size:11px;margin-top:3px}
.bgrid div.off{opacity:.45}.bgrid div.off b{filter:grayscale(1);opacity:.4}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.kstats div{background:var(--in);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.kstats b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}.kstats span{font-size:11px;color:var(--mu);font-weight:600}
.bars3 svg{cursor:pointer}.bars3 text{font-size:10px}
.rg{width:100%;accent-color:var(--ac);height:30px;margin-top:4px}
textarea.in{min-height:64px;resize:vertical}
.cf{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.cf i{position:absolute;top:-20px;border-radius:2px;animation:cf 1.5s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cf{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
.story{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 22px);color:#fff;transition:background .6s;user-select:none;-webkit-user-select:none;cursor:pointer}
.story .bars{display:flex;gap:4px;margin-right:48px}.story .bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28)}.story .bars i.on{background:#fff}
.story .sx{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:16px;background:rgba(0,0,0,.25);border-color:transparent;color:#fff}
.story .sc{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;max-width:520px;width:100%;margin:0 auto}
.story .sc>*{animation:rise .6s cubic-bezier(.2,.9,.25,1) both}.story .sc>*:nth-child(2){animation-delay:.12s}.story .sc>*:nth-child(3){animation-delay:.24s}.story .sc>*:nth-child(4){animation-delay:.36s}.story .sc>*:nth-child(5){animation-delay:.48s}.story .sc>*:nth-child(6){animation-delay:.6s}
.story .xl{font-size:50px;font-weight:800;letter-spacing:-.05em;line-height:1.02}.story .xl small{font-size:20px;opacity:.7}
.story .l{font-size:28px;font-weight:700;opacity:.85}.story .k{font-size:17px;color:rgba(255,255,255,.85);line-height:1.4}
.story .pill{align-self:flex-start;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px;font-weight:800}
.story .sbd{display:flex;flex-wrap:wrap;gap:10px}.story .sbd span{font-size:34px;display:flex;flex-direction:column;align-items:center;width:78px;text-align:center}.story .sbd small{font-size:11px;font-weight:600;opacity:.85}
.story .tap{text-align:center;font-size:12px;opacity:.6}.story .ln2{stroke-dasharray:1200;animation:draw 1.8s ease-out .3s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981" stop-opacity=".28"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient><linearGradient id="jok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#047857"/><stop offset=".45" stop-color="#10b981"/><stop offset=".7" stop-color="#34d399"/><stop offset="1" stop-color="#0369a1"/></linearGradient><linearGradient id="jwarn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#92400e"/><stop offset=".5" stop-color="#f59e0b"/><stop offset=".7" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="jbad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f1d1d"/><stop offset=".5" stop-color="#ef4444"/><stop offset=".7" stop-color="#fca5a5"/><stop offset="1" stop-color="#991b1b"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".02"/><stop offset=".25" stop-color="#fff" stop-opacity=".09"/><stop offset=".4" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient><radialGradient id="sheen" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs></svg>
<main id="view"></main>
<nav id="nav" hidden></nav>
<div id="sheet-root"></div>
<div id="toast"></div>
<input type="file" accept="application/json,.json" id="importIn" hidden>
<script>
'use strict';
/* ---------- Utilitaires ---------- */
const KEY='plan-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const curYM=()=>today().slice(0,7);
const ymAdd=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`};
const ymDiff=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y2-y1)*12+(m2-m1)};

function deltaBetween(a,b){let d=0;for(const ac of S.accounts){const s=SIGN[ac.type];if(!s)continue;const v1=balAt(ac.id,a),v2=balAt(ac.id,b);if(v1==null||v2==null)continue;d+=s*(v2-v1)}return d}
function deltas(){const ms=months(),o=[];for(let i=1;i<ms.length;i++){const g=ymDiff(ms[i-1],ms[i]),d=deltaBetween(ms[i-1],ms[i]);let ex=0;for(let k=1;k<=g;k++)ex+=extrasIn(ymAdd(ms[i-1],k));o.push({from:ms[i-1],ym:ms[i],gap:g,d,spent:(nz(S.salary)*g+ex)-chargesM()*g-d})}return o}
function observedRate(){const d=deltas().slice(-3);if(!d.length)return null;return d.reduce((t,x)=>t+x.d,0)/d.reduce((t,x)=>t+x.gap,0)}

function plan(p0=pool(),r=rate()){
 const now=curYM();let cum=0,req=0;const list=[];
 for(const g of S.goals){const t=Math.max(0,nz(g.target));const alloc=Math.max(0,Math.min(t,p0-cum));cum+=t;
  let eta=null;if(p0>=cum)eta=now;else if(r>0)eta=ymAdd(now,Math.ceil((cum-p0)/r));
  let late=0;if(g.deadline){const ml=Math.max(1,ymDiff(now,g.deadline));if(p0<cum)req=Math.max(req,(cum-p0)/ml);late=!eta?Infinity:Math.max(0,ymDiff(g.deadline,eta))}
  list.push({g,t,alloc,pct:t?alloc/t:0,eta,late,done:t>0&&alloc>=t});}
 return{list,req};
}
function status(){

 else if(req>cap){lvl='bad';title='Objectifs hors de portée';msg=`Même sans aucune dépense courante, il manquerait ${eur(req-cap)} par mois. Repousse une date ou baisse un montant.`}
 else if(r>=req&&r>0){lvl=lateG.length?'warn':'ok';title=lateG.length?'Bon rythme, mais un objectif est en retard':S.goals.length?'Tu es dans les clous':'Tu épargnes, bravo';msg=`Tu peux dépenser jusqu'à <b>${eur(free)}</b> par mois en dépenses courantes sans freiner tes objectifs.`}
 else if(r>0&&r>=req*.75){lvl='warn';title='Tu ralentis, lève le pied';msg=`Tu mets ${eur(r)}/mois de côté, il en faudrait <b>${eur(req)}</b>. Limite tes dépenses courantes à <b>${eur(Math.max(0,free))}</b> par mois.`}
 else{lvl='bad';title='Stop aux dépenses non essentielles';msg=r<=0?`Ton patrimoine ${r<0?`baisse de ${eur(-r)}`:'stagne'} chaque mois. ${req?`Pour tes objectifs il faut mettre <b>${eur(req)}</b>/mois de côté : dépenses`:'Pour recommencer à épargner, garde tes dépenses'} courantes sous <b>${eur(Math.max(0,free))}</b>.`:`Tu mets ${eur(r)}/mois de côté, il en faudrait <b>${eur(req)}</b>. Dépenses courantes max <b>${eur(Math.max(0,free))}</b> par mois.`}
 if(nz(S.salary)&&liquid()<chargesM()&&S.accounts.length){if(lvl==='ok')lvl='warn';msg+=` <br><span class="bad">Attention : ton argent disponible couvre moins d'un mois de charges.</span>`}
 return{lvl,title,msg,free,req,r,cap,obs,p,lateG};
}
function afford(A,mode){

 if(mode==='month'){r2=st.r-A;p2=plan(pool(),r2)}
 else{const surplus=Math.max(0,st.r-st.req);p2=plan(pool()-Math.max(0,A-surplus),st.r);
  if(A>liquid()+pool())return{lvl:'bad',title:'Non, tu n\'as pas cette somme',lines:[`Ton argent disponible (comptes + épargne + placements) est de ${eur(liquid()+pool())}.`]}}
 let worst=0,delays=[];
 base.list.forEach((b,i)=>{const n=p2.list[i];let d=0;if(b.eta&&n.eta)d=ymDiff(b.eta,n.eta);else if(b.eta&&!n.eta)d=Infinity;const newLate=Math.max(0,(n.late||0)-(b.late||0));worst=Math.max(worst,newLate);if(d>0)delays.push({g:b.g,d,newLate,deadline:b.g.deadline})});
 if(!S.goals.length){const marge=mode==='month'?st.r:Math.max(0,st.r);
  if(A<=marge){lvl='ok';title='Oui, vas-y'}else if(mode!=='month'&&A<=liquid()-safetyAmt()){lvl='warn';title='Possible, mais ça entame ton matelas'}else{lvl='bad';title='Mieux vaut attendre'}
  lines.push(mode==='month'?`Tu épargnerais ${eur(r2)} par mois au lieu de ${eur(st.r)}.`:`Ta marge du mois est d'environ ${eur(marge)}.`);
  lines.push('Fixe-toi des objectifs pour des conseils plus précis.');return{lvl,title,lines}}
 if(mode==='month'&&r2<=0){lvl='bad';title='Non, tu n\'épargnerais plus rien'}
 else if(worst===0){lvl='ok';title='Oui, tu peux te le permettre';if(!delays.length)lines.push(mode==='month'?'Tes objectifs restent dans les temps.':'C\'est couvert par ta marge du mois, aucun objectif n\'est retardé.')}
 else if(worst<=2){lvl='warn';title='Possible, mais ça te retarde'}
 else{lvl='bad';title='Non, pas maintenant'}
 delays.forEach(x=>lines.push(`${esc(x.g.emoji||'🎯')} ${esc(x.g.name)} : ${x.d===Infinity?'n\'est plus atteignable à ce rythme':'repoussé de '+dur(x.d)}${x.newLate>0&&x.newLate!==Infinity?` (+${dur(x.newLate)} de retard sur ta date)`:x.d!==Infinity&&x.deadline?' (toujours dans les temps)':''}`));
 if(mode==='month')lines.push(`Ton épargne passerait de ${eur(st.r)} à ${eur(r2)} par mois${st.req?` (il faut ${eur(st.req)})`:''}.`);
 if(lvl!=='ok'&&mode!=='month'){const surplus=Math.max(0,st.r-st.req);if(surplus>0){const m=Math.ceil(A/surplus);if(m>1&&m<=24)lines.push(`Astuce : en mettant ${eur(surplus)} de côté chaque mois, tu peux te l'offrir dans ${dur(m)} sans toucher à tes objectifs.`)}}
 return{lvl,title,lines};
}

 if(f>1)while(ymDiff(ym,curYM())>=f&&g++<400){ym=ymAdd(ym,f);d=mk(ym)}

 <div class="grid2" style="margin:0"><label class="f"><span>Quoi ?</span><input class="in" data-k="wishes|${w.id}|name" value="${val(w.name)}" placeholder="ex. Nouvelle console"></label><label class="f"><span>Prix</span>${money(`wishes|${w.id}|price`,w.price)}</label></div>
 <div class="seg"><button class="${w.need==='besoin'?'on':''}" data-a="wishNeed" data-id="${w.id}" data-v="besoin">J'en ai besoin</button><button class="${w.need!=='besoin'?'on':''}" data-a="wishNeed" data-id="${w.id}" data-v="envie">C'est une envie</button></div>

function sheetDecide(id){const w=S.wishes.find(x=>x.id===id);if(!w)return'';const p=nz(w.price);

/* ---------- Bilan de l'année ---------- */
function recapYear(){const t=new Date();return t.getMonth()===0?t.getFullYear()-1:t.getFullYear()}
function recapData(y){const ys=String(y),all=months(),ms=all.filter(m=>m.startsWith(ys));if(ms.length<2)return null;
 const before=all.filter(m=>m<ys+'-01'),m0=before.length?before[before.length-1]:ms[0],m1=ms[ms.length-1],d=deltas().filter(x=>x.ym.startsWith(ys)),a=totalNet(m0),b=totalNet(m1);
 const best=d.reduce((p,x)=>!p||x.d/x.gap>p.d/p.gap?x:p,null),sp=d.map(x=>x.spent/x.gap),avg=sp.length?sp.reduce((t,v)=>t+v,0)/sp.length:0;
 const abos=S.charges.filter(c=>c.kind==='abo'),topAbo=abos.slice().sort((p,q)=>nz(q.amount)/(+q.freq||1)-nz(p.amount)/(+p.freq||1))[0];
 const wd=S.wishes.filter(w=>w.status==='dropped'&&(w.decided||'').startsWith(ys)),wb=S.wishes.filter(w=>w.status==='bought'&&(w.decided||'').startsWith(ys));
 return{y,ms,a,b,gain:b-a,pct:a>0?(b-a)/a*100:null,saved:d.reduce((t,x)=>t+x.d,0),best,avg,bud:budgetT(),under:sp.filter(v=>v<=Math.max(budgetT(),1)).length,nsp:sp.length,aboY:chargesM('abo')*12,topAbo,wd,wdAmt:wd.reduce((t,w)=>t+nz(w.price),0),wb,bd:BADGES.filter(x=>(S.badgesSeen[x[0]]||'').startsWith(ys)),checks:Object.keys(S.checks).filter(m=>m.startsWith(ys)).length}}
function storyChart(R){const v=R.ms.map(totalNet);if(v.length<2)return'';const mn=Math.min(...v),mx=Math.max(...v),W=300,H=90,pts=v.map((y,i)=>(i/(v.length-1)*W).toFixed(1)+' '+(H-6-(mx===mn?.5:(y-mn)/(mx-mn))*(H-12)).toFixed(1)).join('L');
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px;overflow:visible"><path d="M${pts}L${W} ${H}L0 ${H}Z" fill="rgba(255,255,255,.12)"/><path class="ln2" d="M${pts}" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function recapSlides(R){const o=[],bg=['linear-gradient(160deg,#064e3b,#0c4a6e)','linear-gradient(160deg,#0f766e,#1e3a8a)','linear-gradient(160deg,#065f46,#14532d)','linear-gradient(160deg,#1e3a8a,#4c1d95)','linear-gradient(160deg,#7c2d12,#831843)','linear-gradient(160deg,#4c1d95,#0f766e)','linear-gradient(160deg,#78350f,#7c2d12)','linear-gradient(160deg,#064e3b,#0c4a6e)'];
 o.push(`<img src="icon-192.png" class="logo" style="margin:0 0 8px" alt=""><div class="k">${S.name?esc(S.name)+', voici':'Voici'}</div><div class="xl">Ton année ${R.y}</div><div class="k">${plural(R.checks,'point')} du mois · ${R.ms.length} mois suivis</div>`);
 o.push(`<div class="k">Ton patrimoine net est passé de</div><div class="l">${eur(R.a)}</div><div class="k">à</div><div class="xl" data-count="${Math.round(R.b)}">${eur(R.b)}</div><div class="pill">${eurS(R.gain)}${R.pct!=null&&!S.discreet?` · ${R.pct>=0?'+':''}${Math.round(R.pct)} %`:''}</div>${storyChart(R)}`);
 o.push(`<div class="k">Au total, tu as mis de côté</div><div class="xl">${eur(Math.max(0,R.saved))}</div>${R.best&&R.best.d>0?`<div class="k">Ton meilleur mois : <b>${MOISL[+R.best.ym.slice(5)-1]}</b>, avec <b>${eurS(R.best.d/R.best.gap)}</b></div>`:''}`);
 if(R.nsp)o.push(`<div class="k">Tes dépenses courantes</div><div class="xl">${eur(R.avg)}<small> /mois</small></div><div class="k">${R.under}/${R.nsp} mois sous ton budget de ${eur(R.bud)}</div>`);
 if(R.aboY)o.push(`<div class="k">Tes abonnements t'ont coûté environ</div><div class="xl">${eur(R.aboY)}</div><div class="k">sur l'année${R.topAbo?` · le plus cher : <b>${esc(R.topAbo.label)}</b>`:''}. Tous encore utiles ?</div>`);
 o.push(R.wd.length?`<div class="k">Grâce au délai de réflexion, tu as évité</div><div class="xl">${eur(R.wdAmt)}</div><div class="k">d'achats sur un coup de tête (${plural(R.wd.length,'envie')} abandonnée${R.wd.length>1?'s':''}) 🧘</div>`:`<div class="xl">🧘</div><div class="k">${R.wb.length?plural(R.wb.length,'achat')+' réfléchi'+(R.wb.length>1?'s':'')+' cette année.':'Cette année, note tes envies dans Plan avant d\'acheter : tu verras combien tu économises.'}</div>`);
 if(R.bd.length)o.push(`<div class="k">Badges débloqués</div><div class="xl">${R.bd.length}</div><div class="sbd">${R.bd.map(b=>`<span>${b[1]}<small>${b[2]}</small></span>`).join('')}</div>`);
 const st=status(),nx=plan().list.find(x=>!x.done);o.push(`<div class="xl">Cap sur ${R.y+1} 🚀</div><div class="k">${st.title}.</div>${nx?`<div class="k">Prochain objectif : <b>${esc(nx.g.emoji||'')} ${esc(nx.g.name)}</b></div>`:''}<button class="btn pri" style="margin-top:14px;align-self:flex-start" data-a="storyClose">Fermer</button>`);
 return o.map((h,i)=>({h,bg:bg[i%bg.length]}))}
function openStory(){const y=recapYear(),R=recapData(y);if(!R)return toast(`Il faut au moins 2 points du mois en ${y}`);closeSheetSilent();ui.story={i:0,sl:recapSlides(R)};S.recapSeen=y;save();
 const d=document.createElement('div');d.id='story';d.className='story';d.dataset.a='story';document.body.appendChild(d);document.body.classList.add('noscroll');drawStory()}
function drawStory(){const s=ui.story,el=$('#story');if(!s||!el)return;el.style.background=s.sl[s.i].bg;
 el.innerHTML=`<div class="bars">${s.sl.map((_,i)=>`<i class="${i<=s.i?'on':''}"></i>`).join('')}</div><button class="icon-btn sm sx" data-a="storyClose" aria-label="Fermer">✕</button><div class="sc">${s.sl[s.i].h}</div><div class="tap">${s.i<s.sl.length-1?'Touche pour continuer':''}</div>`;countUp()}

/* ---------- Rendu ---------- */
function render(anim){
 const v=$('#view'),nav=$('#nav');v.classList.remove('enter');
 if(!S.setup){nav.hidden=true;v.innerHTML=vSetup();return}
 nav.hidden=false;
 nav.innerHTML=[['home','Accueil'],['patri','Patrimoine'],['goals','Objectifs'],['wish','Envies'],['budget','Budget']].map(([t,l])=>`<button data-a="tab" data-t="${t}" class="${ui.tab===t?'on':''}"><svg viewBox="0 0 24 24">${ICON[t]}</svg>${l}</button>`).join('');
 document.body.classList.toggle('discreet',!!S.discreet);
 v.innerHTML=({home:vHome,patri:vPatri,goals:vGoals,wish:vWish,budget:vBudget})[ui.tab]();
 checkBadges();
 if(anim){[...v.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,10)));void v.offsetWidth;v.classList.add('enter');countUp()}
}

 {const ry=recapYear();if(recapData(ry))h+=`<button class="btn block" style="margin-top:12px;background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(236,72,153,.18))" data-a="recap">✨ Voir mon bilan ${ry}</button>`}
 if(d.length)h+=`<h2>Historique</h2><section class="card">${d.slice().reverse().slice(0,12).map(x=>`<div class="kv"><span>${fmtYM(x.ym)}</span><b class="${x.d>=0?'ok':'bad'}">${eurS(x.d)}</b></div>`).join('')}</section>`;

function chart(){
 const ms=months();if(!ms.length)return'<div class="empty">Renseigne tes soldes pour voir la courbe.</div>';
 const pts=ms.map(m=>({m,v:totalNet(m)})),last=pts[pts.length-1],r=rate(),proj=[last];
 for(let i=1;i<=12;i++)proj.push({m:ymAdd(last.m,i),v:last.v+r*i});
 const first=pts[0].m,end=proj[proj.length-1].m,span=Math.max(1,ymDiff(first,end));
 const all=[...pts,...proj].map(p=>p.v);let mn=Math.min(...all),mx=Math.max(...all);if(mx-mn<1){mx+=500;mn-=500}const pv=(mx-mn)*.14;mn-=pv;mx+=pv;
 const W=340,H=170,T=16,B=22,X=m=>6+(W-12)*ymDiff(first,m)/span,Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
 const path=a=>a.map((p,i)=>(i?'L':'M')+X(p.m).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const area=pts.length>1?`<path d="${path(pts)} L${X(last.m).toFixed(1)} ${H-B} L${X(first).toFixed(1)} ${H-B} Z" fill="url(#ag)"/>`:'';
 const gl=[.25,.5,.75].map(f=>`<line class="gl" x1="0" x2="${W}" y1="${(T+(H-T-B)*f).toFixed(1)}" y2="${(T+(H-T-B)*f).toFixed(1)}"/>`).join('');
 const DP=esc(JSON.stringify([...pts,...proj.slice(1)].map((p,i)=>[+X(p.m).toFixed(1),+Y(p.v).toFixed(1),fmtYM(p.m)+(i>=pts.length?' (prévu)':''),eur(p.v)])));
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du patrimoine net" data-p="${DP}">${gl}${area}<path class="pj" d="${path(proj)}"/>${pts.length>1?`<path class="ln" d="${path(pts)}"/>`:''}${pts.map(p=>`<circle class="dot" cx="${X(p.m).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${p===last?4:2.5}"/>`).join('')}
 <text x="${X(proj[proj.length-1].m)}" y="${Math.max(11,Y(proj[proj.length-1].v)-8)}" text-anchor="end">${eur(proj[proj.length-1].v)}</text>
 <g class="cur" style="opacity:0" pointer-events="none"><line y1="${T-4}" y2="${H-B}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3"/><circle r="5" fill="#fff" stroke="#10b981" stroke-width="3"/><rect y="0" height="18" rx="9" fill="#5eead4"/><text y="13" text-anchor="middle"></text></g><text x="2" y="${H-6}">${fmtYM(first)}</text>${pts.length>1&&X(last.m)-6>70&&W-X(last.m)>80?`<text x="${X(last.m)}" y="${H-6}" text-anchor="middle">${fmtYM(last.m)}</text>`:''}<text x="${W-2}" y="${H-6}" text-anchor="end">${fmtYM(end)}</text></svg>
 <div class="legend"><span><i></i>Réel</span><span><i class="pj"></i>Projection 12 mois (${eurS(r)}/mois)</span></div>`;
}

 ${x&&nz(g.target)?`<div class="hint">Déjà couvert : <b>${eur(x.alloc)}</b> (${Math.round(x.pct*100)} %).${g.deadline&&!x.done?` Pour l'atteindre à temps, en tenant compte des objectifs prioritaires, il faut épargner environ <b>${eur(Math.max(0,(plan().list.slice(0,plan().list.indexOf(x)+1).reduce((t,y)=>t+y.t,0)-pool())/Math.max(1,ymDiff(curYM(),g.deadline))))}</b>/mois.`:''}</div>`:''}
 <button class="btn pri block" data-a="close">OK</button><button class="btn ghost danger block" style="margin-top:6px" data-a="rmSheet" data-c="goals" data-id="${g.id}">Supprimer l'objectif</button>`}
function sheetExtra(id){const e=S.extras.find(x=>x.id===id);if(!e)return'';
 return sheetHead('Revenu ponctuel')+`<label class="f"><span>Libellé</span><input class="in" data-k="extras|${e.id}|label" value="${val(e.label)}" placeholder="ex. Prime, remboursement…"></label>
 <div class="grid2" style="margin:0"><label class="f"><span>Montant</span>${money(`extras|${e.id}|amount`,e.amount)}</label><label class="f"><span>Date</span><input class="in" type="date" data-k="extras|${e.id}|date" value="${val(e.date)}"></label></div>
 <div class="hint">Il est pris en compte dans le calcul de tes dépenses du mois. Pense à le mettre de côté si tu veux accélérer tes objectifs !</div>
 <button class="btn pri block" data-a="close">OK</button><button class="btn ghost danger block" style="margin-top:6px" data-a="rmSheet" data-c="extras" data-id="${e.id}">Supprimer</button>`}
function sheetCheckin(){const now=curYM();
 return sheetHead('Point du mois · '+MOISL[+now.slice(5)-1])+`<p class="small muted" style="margin-top:-6px">Ouvre tes apps Crédit Mutuel, Revolut, etc. et recopie les soldes. Laisse vide si ça n'a pas changé.</p>
 ${Object.entries(TYPES).map(([k,t])=>{const accs=S.accounts.filter(a=>a.type===k);if(!accs.length)return'';return`<h2 style="margin-top:14px">${t.e} ${t.l}</h2>`+accs.map(a=>{const p=balAt(a.id,ymAdd(now,-1))??bal(a.id);return`<div class="row" style="margin-bottom:8px"><div class="grow"><div style="font-weight:600">${esc(a.name)}</div><div class="small muted">${p!=null?'Avant : '+eur(p):'Nouveau'}</div></div><div style="width:140px">${money('ck|'+a.id,ui.ck[a.id],p!=null?NF.format(p):'0')}</div></div>`}).join('')}).join('')}
 ${S.extras.filter(e=>e.date&&e.date.slice(0,7)===now).length?`<p class="small muted">Revenus ponctuels ce mois : +${eur(extrasIn(now))}</p>`:''}
 <button class="btn block sm" style="margin:6px 0 12px" data-a="addExtraCk">＋ J'ai eu un revenu en plus ce mois-ci</button>
 <button class="btn pri block" data-a="ckSave">Valider mon point du mois</button>`}
function sheetCkResult(){const st=status(),d=deltas(),last=d[d.length-1],isNow=last&&last.ym===curYM();
 return sheetHead('Résultat du mois')+`${isNow?`<div class="card" style="margin-bottom:12px"><div class="kv"><span>Évolution patrimoine</span><b class="${last.d>=0?'ok':'bad'}">${eurS(last.d)}</b></div><div class="kv"><span>Dépenses courantes estimées</span><b>${eur(last.spent/last.gap)}</b></div><div class="kv"><span>Max conseillé</span><b>${eur(Math.max(0,st.free))}</b></div></div>`:'<p class="muted">Premier point enregistré. Le mois prochain, tu verras ton évolution réelle.</p>'}
 <div class="card feu ${st.lvl}">${lights(st.lvl)}<h3>${st.title}</h3><p>${st.msg}</p></div><button class="btn pri block" data-a="close">Fermer</button>`}
function sheetAfford(){const a=ui.af;
 return sheetHead('Je peux me permettre… ?')+`<div class="seg"><button class="${a.mode==='once'?'on':''}" data-a="afMode" data-v="once">Achat unique</button><button class="${a.mode==='month'?'on':''}" data-a="afMode" data-v="month">Chaque mois</button></div>
 <label class="f"><span>${a.mode==='once'?'Prix':'Coût mensuel (abonnement, crédit…)'}</span>${money('af',a.amt,'ex. 800')}</label>
 <button class="btn pri block" data-a="afGo">Vérifier</button><div id="afRes">${a.res?afRes(a.res):''}</div>`}
const afRes=r=>`<div class="res ${r.lvl}">${lights(r.lvl)}<h3>${r.title}</h3>${r.lines.map(l=>`<p class="small" style="margin:4px 0">${l}</p>`).join('')}</div>`;
function sheetSettings(){return sheetHead('Réglages')+`<label class="f"><span>Prénom</span><input class="in" data-k="name" value="${val(S.name)}"></label>
 <div class="grid2" style="margin:0"><label class="f"><span>Salaire net / mois</span>${money('salary',S.salary)}</label><label class="f"><span>Jour de paie</span><input class="in" data-k="payDay" inputmode="numeric" value="${val(S.payDay)}"></label></div>
 <label class="f"><span>Épargne de précaution (mois de dépenses)</span><input class="in" data-k="settings|safety" inputmode="numeric" value="${val(S.settings.safety)}"></label>
 <h2>Extras</h2><button class="btn block" style="margin-bottom:8px" data-a="reminder">⏰ ${S.reminder?'Réinstaller':'Activer'} le rappel mensuel (calendrier)</button>
 <div class="grid2"><button class="btn" data-a="badges">🏅 Mes badges</button><button class="btn" data-a="recap">✨ Bilan ${recapYear()}</button></div>
 <h2>Sauvegarde</h2><div class="hint">Tes données restent uniquement sur cet appareil. Pour les transférer (téléphone ↔ PC) ou les mettre à l'abri : exporte le fichier, puis importe-le sur l'autre appareil.</div>
 <div class="grid2"><button class="btn" data-a="export">Exporter</button><button class="btn" data-a="import">Importer</button></div>
 <button class="btn ghost block" data-a="redoSetup">Relancer la configuration guidée</button>
 <button class="btn ghost danger block" data-a="reset">Tout effacer</button>`}

/* ---------- Actions ---------- */
const A={
 tab(el){ui.tab=el.dataset.t;closeSheetSilent();render(true);scrollTo(0,0)},
 seg(el){selSeg(el)},
 close(){closeSheet()},ovClose(){closeSheet()},
 settings(){openSheet(sheetSettings())},
 wNext(){if(S.step===1&&!nz(S.salary)){toast('Indique ton salaire (tu pourras le modifier)');return}
  cleanup();if(S.step>=STEPS){S.setup=true;if(Object.keys(S.snaps[curYM()]||{}).length)S.checks[curYM()]=today();ui.tab='home';save();render(true);scrollTo(0,0);return}else S.step++;save();render();scrollTo(0,0)},
 wPrev(){cleanup();S.step=Math.max(0,S.step-1);save();render();scrollTo(0,0)},
 addAcc(el){S.accounts.push({id:uid(),name:el.dataset.n,type:el.dataset.t});save();render();if(!el.dataset.n){const ins=document.querySelectorAll('.er input');ins[ins.length-2]&&ins[ins.length-2].focus()}},
 addChg(el){S.charges.push({id:uid(),label:el.dataset.n,cat:el.dataset.c,freq:+el.dataset.f,kind:el.dataset.kind,amount:'',day:''});save();render()},
 addGoal(){S.goals.push({id:uid(),name:'',target:'',deadline:'',emoji:'🎯'});save();render()},
 addSafety(){S.goals.unshift({id:uid(),name:'Épargne de précaution',target:safetyAmt(),deadline:ymAdd(curYM(),12),emoji:'🛟',safety:true});save();closeSheetSilent();render();toast('Objectif ajouté en priorité n°1')},
 rm(el){const c=el.dataset.c;S[c]=S[c].filter(x=>x.id!==el.dataset.id);cleanup();save();render()},
 rmSheet(el){if(!confirm('Supprimer définitivement ?'))return;const c=el.dataset.c;const it=S[c].find(x=>x.id===el.dataset.id);if(c==='charges'&&it&&it.kind==='abo'&&nz(it.amount))S.stats.aboRemoved++;S[c]=S[c].filter(x=>x.id!==el.dataset.id);closeSheet();toast('Supprimé')},
 editAcc(el){openSheet(sheetAcc(el.dataset.id))},
 addAccS(el){const a={id:uid(),name:'',type:el.dataset.t||'epargne'};S.accounts.push(a);openSheet(sheetAcc(a.id));setTimeout(()=>{const i=$('#sheet input');i&&i.focus()},350)},
 editChg(el){openSheet(sheetChg(el.dataset.id))},
 addChgS(el){const k=el.dataset.kind||'fixe',c={id:uid(),label:'',cat:k==='abo'?'Abonnements':'Autre',freq:1,kind:k,amount:'',day:''};S.charges.push(c);openSheet(sheetChg(c.id))},
 chgKind(el){const c=S.charges.find(x=>x.id===el.dataset.id);if(c){c.kind=el.dataset.v;if(c.kind==='abo')c.cat='Abonnements';else if(c.cat==='Abonnements')c.cat='Autre';save();setSheet(sheetChg(c.id))}},
 editGoal(el){openSheet(sheetGoal(el.dataset.id))},
 addGoalS(){const g={id:uid(),name:'',target:'',deadline:'',emoji:'🎯'};S.goals.push(g);openSheet(sheetGoal(g.id))},
 goalEmoji(el){const g=S.goals.find(x=>x.id===el.dataset.id);if(g){g.emoji=el.dataset.v;save();setSheet(sheetGoal(g.id))}},
 mvGoal(el){const i=S.goals.findIndex(g=>g.id===el.dataset.id),j=i+(+el.dataset.d);if(i<0||j<0||j>=S.goals.length)return;[S.goals[i],S.goals[j]]=[S.goals[j],S.goals[i]];save();render()},
 doneGoal(el){const g=S.goals.find(x=>x.id===el.dataset.id);if(!g||!confirm(`Objectif « ${g.name} » atteint et utilisé ? Il sera retiré. Pense à mettre à jour tes soldes si tu as dépensé l'argent.`))return;S.goals=S.goals.filter(x=>x!==g);S.stats.goalsDone++;save();render();confetti();toast('Bravo 🎉')},
 addExtra(){const e={id:uid(),label:'',amount:'',date:today()};S.extras.push(e);openSheet(sheetExtra(e.id))},
 addExtraCk(){const e={id:uid(),label:'',amount:'',date:today()};S.extras.push(e);const keep=ui.ck;setSheet(sheetExtra(e.id).replace('data-a="close">OK','data-a="backCk">OK'));ui.ck=keep},
 backCk(){cleanup();save();setSheet(sheetCheckin())},
 editExtra(el){openSheet(sheetExtra(el.dataset.id))},
 checkin(){ui.ck={};closeSheetSilent();openSheet(sheetCheckin())},
 ckSave(){const now=curYM(),prev=Object.assign({},S.snaps[now]||{});S.snaps[now]=prev;
  for(const a of S.accounts){const v=ui.ck[a.id];if(v!==''&&v!=null&&!isNaN(num(v)))prev[a.id]=num(v);else if(prev[a.id]==null){const p=bal(a.id);if(p!=null)prev[a.id]=p}}
  S.checks[now]=today();ui.ck=null;if(status().lvl==='ok')S.stats.green++;save();setSheet(sheetCkResult())},
 afford(){ui.af={amt:'',mode:'once',res:null};openSheet(sheetAfford());setTimeout(()=>{const i=$('#sheet input');i&&i.focus()},350)},
 afMode(el){ui.af.mode=el.dataset.v;ui.af.res=null;setSheet(sheetAfford())},
 afGo(){const A_=num(ui.af.amt);if(!(A_>0))return toast('Indique un montant');ui.af.res=afford(A_,ui.af.mode);const r=$('#afRes');r.innerHTML=afRes(ui.af.res);const ae=document.activeElement;if(ae&&ae.blur)ae.blur();setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'end'}),50)},
 dismiss(el){S.dismiss[el.dataset.k]=true;save();render()},
 export(){exportData()},import(){$('#importIn').click()},
 redoSetup(){S.setup=false;S.step=0;closeSheetSilent();save();render()},
 reset(){if(!confirm('Effacer toutes tes données ? Cette action est irréversible (exporte d\'abord si besoin).'))return;localStorage.removeItem(KEY);S=load();closeSheetSilent();render()},
};
Object.assign(A,{
 discreet(){S.discreet=!S.discreet;save();render();toast(S.discreet?'Mode discret activé 🙈':'Montants visibles 👁')},
 reminder(){icsReminder()},
 badges(){closeSheetSilent();openSheet(sheetBadges())},
 recap(){openStory()},
 story(el,e){const s=ui.story;if(!s)return;if(e.clientX/innerWidth<.3)s.i=Math.max(0,s.i-1);else if(s.i<s.sl.length-1)s.i++;else return A.storyClose();drawStory()},
 storyClose(){const d=$('#story');if(d)d.remove();ui.story=null;document.body.classList.remove('noscroll');render()},
 bar(el){toast(el.dataset.t)},
 simReset(){ui.sim={m:0,o:0};render()},
 addWish(){const w={id:uid(),name:'',price:'',emoji:'🎁',need:'envie',uses:'',why:'',added:today(),cool:7,status:'wait'};S.wishes.push(w);openSheet(sheetWish(w.id));setTimeout(()=>{const i=$('#sheet input');i&&i.focus()},350)},
 editWish(el){openSheet(sheetWish(el.dataset.id))},
 wishEmoji(el){const w=S.wishes.find(x=>x.id===el.dataset.id);if(w){w.emoji=el.dataset.v;save();setSheet(sheetWish(w.id))}},
 wishNeed(el){const w=S.wishes.find(x=>x.id===el.dataset.id);if(w){w.need=el.dataset.v;save();setSheet(sheetWish(w.id))}},
 wishCool(el){const w=S.wishes.find(x=>x.id===el.dataset.id);if(w){w.cool=+el.dataset.v;w.coolSet=true;save();$('#wCool').innerHTML=coolSeg(w)}},
 decideWish(el){const h=sheetDecide(el.dataset.id);if($('#sheet'))setSheet(h);else openSheet(h)},
 buyWish(el){const w=S.wishes.find(x=>x.id===el.dataset.id);if(!w)return;w.status='bought';w.decided=today();S.stats.bought++;closeSheet();toast('Achat réfléchi 👍 Il apparaîtra dans ton prochain point du mois')},
 dropWish(el){const w=S.wishes.find(x=>x.id===el.dataset.id);if(!w)return;w.status='dropped';w.decided=today();S.stats.dropped++;S.stats.droppedAmt+=nz(w.price);if($('#sheet'))closeSheet();else{save();render()}confetti();toast(`🧘 ${eur(nz(w.price))} économisés`)},
 snoozeWish(el){const w=S.wishes.find(x=>x.id===el.dataset.id);if(!w)return;w.added=today();w.cool=7;closeSheet();toast('Encore 7 jours de réflexion')},
});
function closeSheetSilent(){const r=$('#sheet-root');if(r)r.innerHTML='';document.body.classList.remove('noscroll');cleanup()}

/* ---------- Export / import ---------- */
async function exportData(){
 const data={app:'plan',version:1,exported:new Date().toISOString(),state:S};
 const ok=await shareOrDownload(new Blob([JSON.stringify(data)],{type:'application/json'}),`plan-sauvegarde-${today()}.json`,'Sauvegarde Plan');
 if(ok!==false){S.lastExport=today();save();if(!$('#sheet'))render();toast('Sauvegarde exportée')}
}
async function shareOrDownload(blob,name,title){
 try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return true}}catch(e){if(e&&e.name==='AbortError')return false}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
async function importData(file){
 try{const data=JSON.parse(await file.text());if(!data||(data.app!=='plan'&&data.app!=='myfinance')||!data.state||!data.state.v)throw 0;
  if(!confirm(`Remplacer les données actuelles par la sauvegarde du ${new Date(data.exported).toLocaleDateString('fr-FR')} ?`))return;
  S=Object.assign(blank(),data.state);S.settings=Object.assign(blank().settings,data.state.settings||{});S.stats=Object.assign(blank().stats,data.state.stats||{});save();closeSheetSilent();ui.tab='home';render();toast('Sauvegarde importée');
 }catch(e){toast('Fichier de sauvegarde invalide')}
}

/* ---------- Évènements ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;if(el.dataset.a==='ovClose'&&e.target!==el)return;e.preventDefault();fn(el,e)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.k==='af'){ui.af.amt=el.value;return}
 if(el.dataset.sim){ui.sim[el.dataset.sim]=+el.value;$('#simMv').textContent=eurS(ui.sim.m);$('#simOv').textContent=eurS(ui.sim.o);$('#simOut').innerHTML=simOut();return}
 if(el.dataset.k&&el.dataset.k.startsWith('wishes|')){setK(el.dataset.k,el.value);const id=el.dataset.k.split('|')[1],w=S.wishes.find(x=>x.id===id);if(w){if(el.dataset.k.endsWith('|price')&&!w.coolSet){w.cool=coolFor(nz(w.price));save();const c=$('#wCool');if(c)c.innerHTML=coolSeg(w)}const x=$('#wIns');if(x)x.innerHTML=wishInsight(w)}return}if(el.dataset.k){setK(el.dataset.k,el.value);liveSums()}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='importIn'&&el.files[0]){importData(el.files[0]);el.value='';return}
 if(el.dataset.k&&el.tagName==='SELECT'){setK(el.dataset.k,el.value);
  const p=el.dataset.k.split('|');if(p[0]==='charges'&&p[2]==='freq'){const c=S.charges.find(x=>x.id===p[1]);if(c)c.freq=+el.value;save();if($('#sheet')&&$('#sheet .seg'))setSheet(sheetChg(p[1]))}
  else if(p[0]==='accounts'&&p[2]==='type'&&$('#sheet')&&$('#sheet [data-a="rmSheet"]'))setSheet(sheetAcc(p[1]))}
 if(!S.setup&&el.dataset.k&&el.tagName==='SELECT'&&!$('#sheet'))render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.k==='af'){e.preventDefault();A.afGo()}if(e.key==='Escape'&&$('#story'))A.storyClose();else if(e.key==='Escape'&&$('#sheet'))closeSheet()});
render(true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
